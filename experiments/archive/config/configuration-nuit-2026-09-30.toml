# ─── Configuration de la nuit du 29 au 30 septembre 2026, CANDIDATE pour le pilote régional ─
# Établie sur deux sous-bassins (Outaouais 040110, Châteauguay 030905), deux graines au
# centième près, registre R213 à R232. Sur les années 2020 à 2024 jamais vues : Châteauguay
# 0,59 à 0,80 de KGE, Outaouais volume fermé et quatre saisons relevées. Ce fichier n'est pas
# une configuration complète de territoire : il se fusionne avec celle du socle. Il n'a pas
# encore été exécuté par le pilote.
#
# Depuis le 2026-09-30, le pilote lit les trois pièces qui lui manquaient par ces sections :
# la formule de Penman ([et].formula), le modulateur phénologique ([phenology]) et la porte de
# gel continue ([soil].frozen_gate_continuous). Le coefficient de culture reste APPRIS par le
# champ ; le multiplicateur fixe du banc n'a pas d'équivalent, et c'est voulu.
#
# Le terme MOD16 doit être CENTRÉ ([loss].et_mode = "anomaly") : en mode absolu, sur la
# Châteauguay où MOD16 dépasse le bilan d'eau de 30 %, cette configuration perd 0,06 de KGE
# au lieu d'en gagner 0,21 (R232).

[recette]
MEANDRE_SOL_SEMI_IMPLICITE = 1    # schéma linéairement implicite : gradient borné, graines reproductibles (R197)
ETL_NAPPE_LIBRE = 1
ETL_NAPPE_EXP = 2.0               # Boussinesq partout ; l'exposant de territoire ne transfère pas au sous-bassin (R213, R220)
ETL_NAPPE_SY = 0.05
ETL_NAPPE_KB = 1.5e-3
ETL_NAPPE_ZRIV = 5
ETL_NAPPE_HREF = 2
ETL_NAPPE_ZEXT = 6
ETL_NAPPE_EFRAC = 0.15            # extraction depuis la zone saturée, cohérente avec le débit d'août (R217)

[et]
formula = "penman"

[phenology]
enabled = true
mode = "photo"                    # sénescence par la longueur du jour, seuil calé sur MODIS (11,8 à 11,9 h sur les deux bassins)
params = [56.81, 11.82, 21.1, 0.9]  # émergence (degrés-jours), seuil (h), largeurs ; jeu forestier de l'Outaouais, à caler par territoire sur MODIS
target = "kc"
classes = ["feuillus", "agri"]    # les conifères gardent leur demande (R219)

[loss]
et_mode = "anomaly"

[soil]
layers = 3
frozen_gate_continuous = true

[[soil.process]]
layer = 2
kind = "lateral"
form = "BASE_LINEAR"

[[soil.process]]
layer = 3
kind = "lateral"
form = "BASE_THRESH_POWER"
tau_days = 3.0
exponent = 2.0
scale_mm = 5.0
max_ratio = 2.0

[[soil.process]]
layer = 3
kind = "percolation"
form = "PERC_THRESH_POWER"
tau_days = 2.0
ceiling_mm_per_day = 2.0
