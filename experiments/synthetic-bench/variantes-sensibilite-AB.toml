# Analyse de sensibilite sur le modele fige (recette complete du plan de retrait), 2026-11-11 : familles A
# (prelevements nets d'io-eau, [surface, souterrain]) et B (meteo : facteur sur la precipitation, decalage
# des temperatures a humidite relative constante). Bassin isole (ETL_SUBBASIN), poids figes, trois graines.

[[variant]]
name = "x1"

[[variant]]
