# Phase probabiliste du modele fige du 2026-11-12 avec le terme temporel de la tete (R551) : la largeur lit aussi la montee et la baisse du debit simule.
# Depart de la tete deja ajustee (best-quebec-etl-quantile-gele-s7-e12.pt), terme temporel initialise a zero ; 12 epoques a 3e-2, derniere epoque retenue.
# Copie de quantile-gele-2026-11.toml ; seule [quantile] temporal differe.

[period]
# Entrainement 2001-2018 (l'annee 2000 sert de mise en regime), validation 2019-2021, evaluation 2022-2024, jamais utilisee pour l'entrainement.
train_end = "2018-12-31"
val_start = "2019-01-01"
val_end = "2021-12-31"
eval_start = "2022-01-01"
eval_end = "2024-12-31"

[model]
routing_mode = "operator-lagged"
use_frost_rankinen = true # gel RANKINEN (isolation neige + profil)
column_theta_init_frac = 0.9 # theta init = 0.9·thetas (init Hydrotel validé, bat 0.3 du cache)
compile_soil = true # ~1.5x plus rapide qu'en mode eager
field_hidden = 256 # neurones par couche du champ spatial ; meme taille pour un territoire et pour le Quebec entier
spatial_melt = true

[column]
# Reglages de la colonne verticale, declares dans meandre/utils/settings.py.
n_substeps = 64 # sous-pas du sol par jour (stabilite du Muskingum a K court)
semi_implicit_soil = true # schema lineairement implicite du sol : gradient borne, graines reproductibles
penman_snow = true # couvert nival dans Penman (R265)
transpiration_soil_temp_ref = 1.0 # transpiration freinee par le sol froid, echelle 1 degre (R264)
viscosity_tref = 5.0 # conductivite corrigee par la viscosite de l'eau (Vogel), reference 5 degres
saturated_area_exponent = 8.0 # ruissellement sur les aires saturees, part (theta1/thetas1)^8

[routing]
muskingum_k_hours = [4.0, 48.0, 24.0] # temps de transfert, en heures : borne basse, borne haute, valeur initiale

[compute]
operator_block = 4096 # routage : etage de plus de 4096 rivieres decoupe en bassins independants, resultat identique ; sans lui la matrice du Quebec entier ne tient pas dans 8 Go
gradient_segments = 10 # gradient recalcule par segments de 10 jours : la province tient dans 8 Go

[quantile]
enabled = true # phase probabiliste
temporal = true # montee et baisse du debit simule dans la largeur (R551)
# Phase probabiliste (ETL_QUANTILE=1), sans effet sur le modele deterministe.
log_step = 0.05 # largeur de chaque niveau de quantile, dans le logarithme du debit
log_bound = 4.0 # un quantile extreme reste entre e^-4 et e^4 fois la mediane

[trainer]
# Reglages de l'entraineur, declares dans meandre/utils/settings.py.
step_per_block = true # un pas d'optimisation par bloc ; sans lui une epoque = un pas (R78, R288)
lr_mult_heads = 1.0 # tetes du champ au taux commun : la volatilite venait d'elles (R195, R276)

[soil]
layers = 3
frozen_gate_continuous = true # porte de gel continue : la regle tout ou rien est fausse en amplitude partout (R224)
# Epaisseurs des couches (m), non des profondeurs : Z2 et Z3 apprises par troncon entre leurs bornes.
z2_min = 0.30
z2_max = 1.50
z3_min = 0.50
z3_max = 4.00

[training]
lr = 3e-2 # phase quantile, taux constant (R388)
grad_clip = 1.0
tbptt_steps = 365
chunk_steps = 90 # blocs de 90 jours : a 30 jours le gradient ne voyait pas l'effet differe de la recharge sur l'etiage (R365)
warmup_epochs = 0 # pas de montee du taux
tws_shape_only = true # GRACE en forme, s'il est active
patience = 0 # phase quantile : derniere epoque retenue (R388)
autopilot = false # phase quantile : taux constant
autopilot_grace_epochs = 8
autopilot_beta_threshold = 0.10
autopilot_lr_patience = 6
autopilot_lr_factor = 0.5
autopilot_lr_min = 1e-5
autopilot_restart_regression = 0.05
autopilot_restart_max = 3
# Rappel doux des parametres vers les valeurs de la litterature, en ecart de logarithme.
w_prior = 0.005
w_deviation_prior = 0.02 # rappel des porosites vers la texture, en ecart de logarithme (mode niveau)

[loss]
# Section lue d'un bloc par le pilote ; une variable ETL_W... posee au lancement remplace le poids.
w_nse = 0.0
w_kge = 1.0
w_pbias = 0.5
w_et = 0.0 # MOD16 retire de la perte (R534)
et_mode = "anomaly" # MOD16 compare centre : la saison, jamais le niveau (R24, 2026-08-21)
w_tws = 0.0 # GRACE retire : calcule par bloc, il etait eteint a 30 jours et explosait a 90 ; corrige dans le code, non eprouve
w_tws_clim = 0.0
w_swe_mass = 0.0
w_mse = 0.1
w_log_nse = 0.0
w_log_mse = 0.3
w_peak = 0.0
w_etiage = 1.0 # etiage
w_fdc_bas = 1.0 # soutien d'etiage
w_dq = 0.5 # variations journalieres du debit
w_snow = 0.0 # pas de supervision de la fonte par la couverture MODIS
w_nrmse = 0.0
w_physics = 0.01

[literature_prior]
K_c = 1.0 # coefficient cultural initial, autour de la demande apprise

[field.texture_bounds]
enabled = true
factor = 3.0 # conductivite bornee par la texture du sol, facteur 3 de part et d'autre

[snow]
wet_bulb_threshold = -0.8
seasonal_melt_amplitude = 0.5

[groundwater]
aquifer = true
free_recession = true
water_table = true
exponent = 2.0
specific_yield = 0.05
conductance = 1.5e-3
river_depth_m = 5
reference_head_m = 2
extinction_depth_m = 6
extraction_fraction = 0.15

[spatial]
no_latent_codes = true
priors = true # porosites par troncon tirees de la texture
global_normalization = true

[evaporation]
open_water = true
# mod16_snow_scale_mm = (absent) # sans objet sans MOD16 (R534)

[forcing]
suffix = "-casr-brut-vent" # vent de CaSR converti de noeuds en m/s (2026-11-11)

[phenology]
enabled = true
params = [56.81, 11.82, 21.1, 0.9] # emergence (degres-jours), seuil (h), largeurs ; jeu forestier de l'Outaouais
classes = ["feuillus", "agri"] # les coniferes gardent leur demande
crop_params = [500.0, 11.82, 100.0, 0.9] # forme propre aux grandes cultures, levee a 500 degres-jours (R535)

# -- Sol declare par couche (2026-09-30, R223 a R229) ----------------------------------------
[[soil.process]]
layer = 2
kind = "lateral"
form = "BASE_LINEAR"

[[soil.process]]
layer = 3
kind = "lateral"
form = "BASE_THRESH_POWER"
tau_days = 3.0
exponent = 2.0
scale_mm = 5.0
max_ratio = 2.0

[[soil.process]]
layer = 3
kind = "percolation"
form = "PERC_THRESH_POWER"
tau_days = 2.0
ceiling_mm_per_day = 2.0 # troncons sans classe de drainage ; les autres recoivent la regle de [soil.ceiling_from_drainage]

[[soil.process]]
layer = 1 # la manette est hors du sol : le stock de nappe
kind = "runoff"
form = "SPILL_GW"
capacity_mm = 65.0 # reglage de l emulateur (R489)
reference_mm = 80.0 # environ 1,8 fois le 90e centile d ete du stock lent (R489)

[soil.ceiling_from_drainage]
# log10(plafond en mm/j) = intercept + slope x classe de drainage (1 tres rapidement a 7 tres mal draine), regle unique ajustee sur le plafond prefere par station de 83 stations et cinq territoires (R370).
table = "{DERIVES}/auxiliaires/slc-drainage-troncons.parquet"
intercept = 1.416
slope = -0.32
min_mm_per_day = 0.25
max_mm_per_day = 4.0

[stations]
area_ratio = true # observe rapporte a l'aire du troncon qui porte la station (R429) ; 062002 est en amont de SAGU01101 et se corrige ainsi
attachment_table = "{DERIVES}/auxiliaires/station-attachment.csv" # audit_stations.py : 3 troncons voisins meilleurs, 02E901 hors territoire (R430) ; fichier renomme le 2026-10-28, ex-name rattachement-stations.csv

[land_cover]
impervious_table = "{DERIVES}/auxiliaires/impermeable-worldcover-troncons.parquet"

[priors]
keys = "porosity_1,porosity_2,porosity_3"
level_keys = "porosity_1,porosity_2,porosity_3"

[lakes]
enabled = true
share_coefficient = 6.7 # fixe a la valeur apprise en affinage (R507) ; appris de zero, il derive et le gain disparait (R510, R514)
residence_from_volume = true # sejour deduit du volume des lacs par troncon
mobilizable_depth_mm = 171.0 # fixe a la valeur apprise en affinage (R507)
outflow_exponent = 1.0
reference_height_m = 0.5
share_bounds = [0.5, 50.0]
mobilizable_depth_bounds_mm = [20.0, 2000.0]
learn = []
