# ─── Ronde provinciale du 30 septembre 2026 ───────────────────────────────────
# Recette de la ronde UNIQUE prévue pour le livrable. Elle hérite de `socle.toml` et y ajoute
# ce que les mesures du 18 au 21 septembre ont établi. Chaque ligne porte la mesure qui la
# justifie ; une ligne sans justification n'a rien à faire ici.
#
# S'emploie comme le socle, la météo restant posée au lancement :
#   ETL_CONFIG=.runs/quebec/config/ronde-2026-09-30.toml JOINT_FX_SUFFIX=-budyko \
#   ETL_REGION=GASP python .runs/quebec/etl_run.py
#
# CE QUI RESTE À DÉCIDER AVANT DE SOUMETTRE : la composition de la fonction de perte. Les deux
# jeux de poids candidats sont écrits plus bas, l'un actif et l'autre en commentaire, et la
# section qui les sépare dit ce qui les départage et ce qu'il manque pour trancher.

# All paths are relative to repo root (project runs from there).
# Weather grid is an absolute path (large external dataset).
# Supported formats: .zarr, .nc, .grib/.grib2/.grb

[paths]
basin_db = "D:/meandre-data/quebec/gasp.duckdb"
basin_db_pc = "D:/meandre-data/quebec/gasp.duckdb"   # Planetary Computer version
#weather_grid   = "/home/essi/Documents/quebec.zarr"
weather_grid = "C:/Users/parse01/documents-locaux/rqh-local/io_2026-04/data/03_imputation/quebec.zarr"
#weather_grid   = "/mnt/c/Users/parse01/documents-locaux/rqh-local/io_2026-04/data/03_imputation/quebec.zarr"
forcing_cache = "D:/meandre-data/quebec/forcing-gasp-budyko.nc"  # CaSR 7 canaux (+ DT_eff durée d'orage)
checkpoint = "checkpoints/best-gasp-v4.pt"
fields_nc = "D:/meandre-data/quebec/results/fields-gasp-v4.nc"
reach_parquet = "D:/meandre-data/quebec/results/reach-gasp-v4.parquet"
runs_db = "data/runs-win.duckdb"

[basin]
prefix = "SLSO"

[temporal]
# Strict data split: train (optimisation), dev (early stop + checkpoint
# selection), test (NEVER seen during training, honest final metric).
# Avoids data leak via checkpoint selection on the evaluation period.
date_start = "2000-01-01"   # forcing window start (zarr io_2026-04)
spinup_end = "2000-12-31"   # 1-year spinup
train_start = "2001-01-01"   # 18-year calibration (multi-regime, incl. 2001 droughts, 2011 floods)
train_end = "2018-12-31"
val_start = "2019-01-01"   # 3-year dev (climatic mix) — avoids anomalous-year bias
val_end = "2021-12-31"
test_start = "2022-01-01"   # 3-year test (held-out, honest final metric)
test_end = "2024-12-31"
date_end = "2024-12-31"   # forcing window end

[model]
routing_mode = "operator-lagged"
# Célérité dépendante du débit : pics plus rapides (corrige le pic hortonien +2j vs réel +1j).
discharge_dependent_celerity = false
dq_beta = 0.5
use_temperature = false
n_forcing = 6      # P, T_min, T_max, R_n, u2, e_a (pas de DT_eff)
context_window = 30
residual_history = 14
max_travel_days = 20
dropout = 0.0    # Standard MC Dropout (0 = disabled when using concrete)

# ── Position B uncertainty stack ───────────────────────────────────────
# Concrete Dropout on temporal_encoder ONLY (epistemic uncertainty over
# the interpretation of the meteorological context). The spatial encoder
# uses ParamNoise below (mass-conserving parametric uncertainty).
# To fully disable Concrete Dropout, set to false.
concrete_dropout = false  # Phase B (déterministe) — réactiver pour Phase 2 UQ calibration
concrete_init_p = 0.1
# ParamNoise: learnable Gaussian σ injected on fc_out logits of the NeRF
# (before constraints). Preserves the water balance because constraints
# bound the perturbed params within their physical ranges. Each ensemble
# member = a coherent bounded param set (analogous to an alternative
# Hydrotel calibration). See README for details.
param_noise = false  # Phase B (déterministe) — réactiver pour Phase 2 UQ calibration
param_noise_init_sigma = 0.01   # logit-space perturbation (0.01 = gentle for fine-tune)

# Spatial parameter mode: "nerf" or "static"
# nerf: Learn continuous parameter fields per-node (default HydroModel mode)
# static: Use global parameters like Hydrotel (28 params only!)
param_mode = "nerf"

# ── Colonne Hydrotel FIDÈLE (Phase A) ──────────────────────────────────
# Remplace VerticalColumn par HydrotelColumn : neige degré-jour → gel Rankinen
# → ETP → ETR par couche → sol BV3C2 cloné (validé décimale vs C++) → milieu
# humide isolé (inactif ici : SLSO Hydrotel a MILIEUX HUMIDES ISOLES=0). Le
# [soil] ci-dessous est sans effet en mode hydrotel (sauf hydrotel_calib_dir).
column_mode = "hydrotel"
# RUISSELLEMENT HORTONIEN sous-journalier : excès d'infiltration piloté par l'intensité
# réelle (DT_eff, canal 6). Génère le quickflow d'orage d'été que le pas journalier
# DT_H=24 écrasait (cause racine du déficit d'été + baseflow excédentaire, diag 2026-06-30).
# Capacité d'infiltration = ks1·DT_eff ; apprenable. Le ksat0.5 reste (abaisse ks1).
use_hortonian = false
use_frost_rankinen = true        # gel RANKINEN (isolation neige + profil)
column_theta_init_frac = 0.9     # theta init = 0.9·thetas (init Hydrotel validé, bat 0.3 du cache)
compile_soil = true  # triton-windows tcc OK sur Windows natif (test 2026-07-02)               # ~1.5x plus rapide qu_eager (17 vs 26+ min/epoch), prouve complete
# ── RECETTE FRESHET (sweep eval 2026-06-26 : melt0.4+ksat0.3 = parité Hydrotel 0.759) ──
melt_factor_scale = 0.4          # fonte ÷2.5 : 12/14/16 trop fort → freshet précoce. Aligne r/timing.
use_latent_codes = true
spatial_melt = true
latent_mode = "additive"
ksat_scale = 1.0                 # PAS de rustine : l'Hortonien EST le levier de génération de quickflow
                                 # (ks1·DT_eff réaliste). ksat0.5 par-dessus = double comptage qui casse r.
                                 # plus humide -> amortit les pics flashy, vise gamma 1.13 -> ~1.0 (attribution 2026-06-29)

[et]
# McGuinness : ETP fidèle au run Hydrotel SLSO de référence (pas Penman).
mode = "mcguinness"

[forcing]
# Surcharge optionnelle des variables énergie/humidité par ERA5-Land mesuré
# (sinon : proxies dérivés de la température — R_n via Hargreaves, e_a = es(Tmin),
# u2 constant). Grille ERA5-Land 9 km sur le bbox, interpolée au nœud le plus
# proche, rayonnement NET (ssr+str). Téléchargée mois par mois via l'API CDS et
# cachée (1er run lent, runs suivants instantanés). Cache forçage distinct du
# proxy (suffixe -era5-...), donc activer/désactiver ne corrompt rien.
#
# era5_vars : sous-ensemble de ["R_n", "e_a", "u2"]. Vide/absent = proxies.
# Diagnostic 2026-05-26 (SLSO 2018) : R_n = plus gros gain (Hargreaves
# surestime l'été ~+10 %, RMSE quotidien ~30 %) ; e_a marginal en boréal
# humide ; u2 rate le creux estival. Requiert cdsapi + clé ~/.cdsapirc.
era5_vars = []   # ex. ["R_n", "e_a", "u2"] pour tout surcharger
# era5_cache = "data/era5"                 # optionnel (défaut: <forcing_cache>/era5)
# era5_bbox  = [-73.0, 44.5, -69.6, 47.7]  # optionnel (défaut: nœuds + marge 0.2°)

[soil]
# REPRODUCE : ancre le sol sur la calibration Hydrotel (bv3c.csv + textures,
# agrégée UHRH→troncon). Optionnel — retirer cette ligne pour découpler (NeRF).
# (B decouple : ancrage Hydrotel retire) hydrotel_calib_dir = "/mnt/c/Users/parse01/documents-locaux/GitHub/plateformes-hydrotel/LN24HA/SLSO_LN24HA_2020"
# Layer thicknesses (m), NOT depths from surface.
# Layers stack: L1 = [0, z1], L2 = [z1, z1+z2], L3 = [z1+z2, z1+z2+z3]
# Total soil depth = z1 + z2 + z3 (derived).
#
# Z1 fixed (surface root zone), Z2 and Z3 learnable per-node (NeRF) within
# their bounds. With these defaults, total depth ∈ [1.10, 5.80] m.
# For Canadian Shield (thin soils): use z3_max = 1.5 conservative.
# For deep St. Lawrence alluvium: z3_max = 5.0.
runoff_clean = true
z1 = 0.30      # m, thickness of L1 (fixed)
z2_min = 0.30      # m, thickness of L2 (min)
z2_max = 1.50      # m, thickness of L2 (max)
z3_min = 0.50      # m, thickness of L3 (min)
z3_max = 4.00      # m, thickness of L3 (max)
# Sub-daily storm duration (Eagleson infiltration excess)
rain_hours_min = 2.0       # h (intense convective storms)
rain_hours_max = 8.0      # h (long frontal rains)

[training]
n_epochs = 30   # MULTI-OBJ : recette + routage fixe + MODIS ET (ancre ET/volume, corrige derive beta) + GRACE TWS.
lr = 5e-4
lr_finetune = 2e-4
lr_new_features_mult = 10.0   # fc1/fc2 get 10x the base LR when fine-tuning with new features
weight_decay = 2e-4
grad_clip = 1.0
tbptt_steps = 365
chunk_steps = 45            # reduit pour la colonne hydrotel sur GPU 8GB (boucle sous-pas = graphe autograd lourd)
val_every = 1              # validation every epoch (required by autopilot)
patience = 8              # ARRET ANTICIPE, mesure le 2026-08-21 sur 37 runs et 263
                          # ameliorations : l'intervalle MEDIAN entre deux progres est
                          # de 1 epoque, et la queue apres le dernier progres vaut 476
                          # epoques sur 940, soit 51 % du calcul. Une amelioration qui
                          # arrive apres 3 a 5 epoques de creux peut valoir 0.0297,
                          # au-dessus du bruit du modele (0.025) ; au-dela de 6 epoques
                          # le gain maximal observe tombe a 0.0184 et, apres 11 epoques,
                          # a 0.0037 -- sept fois sous le seuil de detection. Une
                          # patience de 8 preserve donc tout ce qui est mesurable et
                          # economise 28 % du calcul. La valeur de 50 ne se declenchait
                          # JAMAIS sur des runs de 30 epoques.
best_metric = "kge_median" # Checkpoint on pooled KGE (published hydro convention). Options: "nse", "kge", "kge_station", "kge_median"
warm_start = false   # cold : checkpoint cleanh = colonne native incompatible avec hydrotel
# warm_start_from desactive (cold start colonne hydrotel)
compile_modules = false  # Triton missing on Windows → torch.compile crashes on first forward

# Soft prior regularization on spatial NeRF parameters (k_gw, krec, K_c).
# Penalises log-space deviations from literature targets (Rawls/Hydrotel SLSO).
# Prevents wet/dry overfit on dev (e.g. k_gw drifting toward ~0.005 → 200d recession
# while real QC = 30-100d). 0.005 = soft pull (still allows learning), 0.05 = strict.
w_prior = 0.005

# ── Position B uncertainty regularizers ───────────────────────────────
# w_param_noise_kl: penalises log_sigma deviation from log(target_sigma).
#   Without it, σ→0 (collapse, degenerate ensemble). 0.1 = moderate pull.
# train_with_param_noise: if true, training forward pass uses
#   perturb_params=True. Lets σ learn via gradient (data loss vs
#   regularisation). Recommended for true UQ calibration.
# w_concrete_kl: weight of the Concrete Dropout KL. Kept low to avoid
#   dominating the data loss (cf. previous collapse).
w_param_noise_kl = 0.0   # Phase B (déterministe) — KL inactive when param_noise=false
param_noise_target_sigma = 0.05
train_with_param_noise = false # Phase B (déterministe)
w_concrete_kl = 0.0   # Phase B (déterministe) — KL inactive when concrete_dropout=false

# Curriculum: epoch at which each module is activated
enable_temporal_epoch = 0
enable_residual_epoch = 9999 # disabled — current design doomed (gate never trained + noise injection at activation), pending redesign
enable_travel_epoch = 9999 # 10, or 0 for warm-start past epoch 20
# Over this many epochs after residual activation, the effective gate
# multiplier ramps linearly 0 -> 1.  Avoids the loss spike caused by
# activating random-init GRU weights abruptly.  Set to 0 to disable.
residual_warmup_epochs = 5
# Over this many epochs after TTA activation, the routing aggregation
# blends linearly from simple sum (Σ Q_actuels) to full TTA attention.
# Avoids a sudden semantic change when warm-starting from a checkpoint
# trained without TTA.  Set to 0 to use pure TTA immediately.
tta_warmup_epochs = 10

# ── Autopilot ──────────────────────────────────────────────────────────
# Autonomous calibration — adjusts hyperparameters based on validation
# metrics. Designed for long unsupervised runs.
autopilot = true
autopilot_grace_epochs = 8      # 15 couvrait le pic
autopilot_beta_threshold = 0.10  # 1.0 neutralisait la détection (revue autopilote 2026-07-02)
autopilot_beta_penalty = 0.005 # w_residual increment per epoch
autopilot_gamma_threshold = 0.20  # |γ-1| > 0.20 → bump w_residual
autopilot_gamma_penalty = 0.003
autopilot_lr_patience = 6      # réduire LR plus tôt
autopilot_lr_factor = 0.5
autopilot_lr_min = 1e-5
autopilot_restart_regression = 0.05 # 5% regression + drift → restart
autopilot_restart_max = 3
# autopilot_activate_residual_at_kge = 0.55  # disabled: residual must be redesigned (cf. memory 2026-04-24)
# TTA disabled by autopilot: random-init weights crash the model
# immediately. Needs a warmup gate like the residual corrector
# (tta_warmup_factor) but that warmup doesn't yet interact with
# autopilot restart. Enable only once the warmup is wired.
# autopilot_activate_tta_at_kge = 0.65

[loss]
# Weights of the loss components.
# NSE/KGE/NRMSE/log-NSE: per-station, NOT chunk-safe (requires chunk_steps=0).
# MSE/log-MSE/PBIAS    : chunk-safe, usable with gradient accumulation.
#
# To favour low flows: increase w_log_nse or w_log_mse (log-space amplifies
# baseflow). For an honest volumetric balance: increase w_pbias.
# For high flows: NSE dominates naturally.
#
# Regularisation:
#   w_physics  — penalises water-balance residual (mass closure)
#   w_residual — penalises residual corrector amplitude (keep physics dominant)
w_nse = 0.0 # Nash-Sutcliffe Efficiency. NOT chunk-safe — disabled with chunk_steps>0
w_kge = 1.0 # Per-station KGE — directly targets beta, r, gamma.
                   # Chunk-approximate but the signal on beta/r is much stronger
                   # than MSE alone. Bumped to 1.0 (vs 0.5) to counter the
                   # flat-signal collapse.
w_pbias = 0.5 # reduit : l_ET ancre le volume physiquement (MODIS), plus besoin du pbias brut fort.
# ── MULTI-OBJECTIF (tache #3) ──
w_et = 1.0   # MSE(etr_sim, MODIS MOD16). Modele sous-evapore (491 vs 581 mm/an) -> ancre l_ET en haut,
et_mode = "anomaly"  # MODIS pour la FORME, jamais pour le NIVEAU (R24, 2026-08-21).
             # Le modele evapore 422 mm/an, dans la fourchette boreale 400-500 des tours a flux ;
             # MOD16 impliquerait 539, au-dessus, et le registre note un biais haut de 15-30 % a
             # l'est. En mode "level" la contrainte pousserait donc hors de la plage credible.
             # En "anomaly" les deux cotes sont centres par noeud sur la serie entiere : il ne
             # reste que la saisonnalite, ou MOD16 est informatif. Le residu centre dit que la
             # saison d'evaporation du modele est EN RETARD (-0.59 juin, -0.53 juillet, +0.51
             # septembre, +0.66 octobre), ce qui identifie le PhenologyModulator (K_c par GDD)
             # plutot qu'un niveau global.
             # baisse le volume, CORRIGE la derive beta. Contraint K_c (identifiabilite). Couverture 2013-2024.
w_tws = 0.2  # GRACE TWS mensuel (anomalie stockage total basin, sigma=25mm). Garde-fou stockage. 2002-2026.
w_tws_clim = 0.05  # Biais saisonnier GRACE par mois calendaire (R23, 2026-08-21). Le terme
             # ci-dessus juge chaque mois a l'incertitude d'UNE observation GRACE (25 mm) et se
             # declare satisfait a 1.05 ecart-type, alors que 65 % du residu est un biais
             # SYSTEMATIQUE (+44 mm mars, -47 mai sur le champion OUTV). Juge a l'incertitude de
             # la climatologie (5.4 mm = 25/sqrt(21 ans)), ce meme residu vaut 4.8 ecarts-types.
             # PREMIERE VALEUR JAMAIS ESSAYEE, a balayer : L_clim part a ~23, donc 0.05 le rend
             # comparable au terme de debit (O(1)) sans le dominer.
w_swe_mass = 0.0  # CanSWE : MASSE du manteau mesuree au sol (R24, 2026-08-21). A ZERO
             # par defaut : la cible est cablee et testee mais jamais encore entrainee. w_snow
             # (couverture MOD10) sature des qu'il y a un peu de neige et sous-estime sous
             # couvert forestier, au point de demander au modele de fondre PLUS TOT alors qu'il
             # lit moins de neige que le reseau au sol (0,77 en mars sur OUTV). La masse
             # n'a pas ce defaut. Echelle interne 100 mm ; filtres de representativite 15 km et
             # 150 m dans build_swe_targets. Sites retenus : outv 97, sagu 37, slno 33, gasp 49,
             # abit 12 ; mont et slso n'en ont aucun et le poids s'y eteint tout seul.
w_mse = 0.1 # MSE (kept low to avoid flattening peaks; log_mse handles low flows)
w_log_nse = 0.0 # NSE on log-flows. NOT chunk-safe.
w_log_mse = 0.3 # MSE on log-flows. Chunk-safe. Emphasises baseflow.
w_peak = 0.5    # protege le gain de pic de la porte gel (sinon le NeRF le troque contre du KGE)
                   # Lowered from 0.5 to 0.3: too strong was pulling toward a flat signal (collapse 2026-05-04).
w_nrmse = 0.0 # Normalised RMSE. Dimensionless, gives a relative error.
w_physics = 0.01 # Penalises water-balance non-closure (P − ET − Q − ΔS ≈ 0). Forces the model to respect physics.
w_residual = 0.01 # L2 regularisation on the residual corrector. Keeps corrections small so the physics component dominates.

# ─── Literature Prior ─────────────────────────────────────────────────────
# Override spatial parameter initialization when training from scratch.
# Defaults (in code) come from public literature for temperate forested
# loam/silt_loam: Rawls 1982 (soil hydraulics), Hock 2003 (snow degree-day),
# Chow 1959 (Manning), Allen et al. 1998 FAO-56 (Penman-Monteith ET).
# Uncomment and adjust any value to override the default.
#
[literature_prior]
# B : init K_c < 1 (McGuinness ETP=881mm sur-estime ~75% ; le NeRF affine par
# noeud). Cale beta vers 1 d'emblee (au lieu d'apprendre K_c depuis 1.0).
K_c = 0.6
# K_sat_1 = 0.010            # m/day (Rawls loam=0.013, silt_loam=0.007)
# K_sat_2 = 0.005            # m/day
# K_sat_3 = 0.002            # m/day
# porosity_1 = 0.46          # m3/m3
# theta_fc_1 = 0.30          # m3/m3
# theta_wp_1 = 0.125         # m3/m3
# C_f = 4.5                  # mm/C/day (Hock 2003 typical 4.0-5.0)
# T_melt = -0.5              # C (typical -2.5 to 0.5 for boreal)
# krec = 0.0005              # 1/day (Hydrotel BV3C: 1e-5 m/h = 2.4e-4 m/day)
# vg_n = 1.5                 # van Genuchten n (loam)

# ---------------------------------------------------------------------------
# RECETTE : les reglages que le pilote lisait jusqu'ici dans l'environnement.
#
# Inventaire du 2026-09-03 : la configuration effective d'une execution ne se lisait ni
# dans ce fichier ni dans le point de reprise, mais dans le bloc de variables du script
# shell qui la lancait. Soixante-dix reglages de physique n'avaient aucune trace
# persistee. Cette section les rend exprimables ici.
#
# ORDRE DE PRIORITE : la variable d'environnement prime si elle est posee, puis cette
# section, puis le defaut du code. Un script de grappe existant se comporte donc
# exactement comme avant.
#
# Ce bloc encode la LOI DES ANCRAGES du 2026-08-15, la configuration retenue : imposer
# tout le calage de sol d'Hydrotel SAUF la conductivite a saturation et les porosites,
# qui restent au champ appris, plus l'evapotranspiration Linacre calee du projet et le
# seuil pluie-neige du projet. Mesure sur la periode d'evaluation independante :
# 0.739 sans entrainement et 0.781 apres trente epoques sur l'Outaouais, contre 0.499
# pour le modele precedemment retenu.
#
# NE FIGURE PAS ICI, et reste au lanceur : ETL_REGION (la region), ETL_MELT_DIR (un
# chemin par region), ETL_TAG, ETL_EPOCHS, ETL_WARM_FROM. Ce sont des parametres de
# lancement, pas de recette.

[recette]

# -- Ancrages, inchangés depuis le socle --------------------------------------
ETL_INIT_HYDROTEL = "sauf_ks"
ETL_ETP = "linacre"
ETL_NO_LATENT = 1
ETL_SEUIL_NEIGE = 0
ETL_SEUIL_TWB = -0.8
ETL_MELT_SAISON = 0.5
ETL_WSNOW = 0                   # couverture MODIS : ne mesure pas une masse, reste à zéro

# -- Protocole d'entraînement --------------------------------------------------
# Un pas d'optimisation par bloc. Absent des modèles du 15 septembre, et c'est la raison
# première pour laquelle une ronde est refaite.
MEANDRE_PAS_PAR_BLOC = 1
MEANDRE_ETAT_CONTINU = 1
MEANDRE_KGE_CONTINU = 1
MEANDRE_Z_TENSEUR = 1

# -- Drainage profond et nappe libre ------------------------------------------
# Justification, et c'est la plus forte du chantier. Sur 34 puits du réseau de suivi répartis
# sur deux territoires, la colonne ainsi corrigée place le maximum de nappe au mois mesuré,
# reproduit le cycle saisonnier à 0,84 et 0,86, et garde des anomalies interannuelles
# positives sur la TOTALITÉ des puits. La colonne d'origine est anticorrélée et ne bat que de
# deux à sept centimètres contre environ un mètre mesuré. Aucune de ces grandeurs n'était dans
# la fonction objectif des simulations comparées.
# Sur le débit, cette correction ne coûte ni ne rapporte : l'effet mesuré vaut sept millièmes
# de KGE pour un bruit de trois millièmes et demi.
ETL_L3_TAU = 2                  # drainage de l'eau gravitaire de la couche 3, en jours
# PLAFOND DE PERCOLATION SUIVANT LE CHAMP SPATIAL (2026-09-22). Il etait pose a une constante
# de 3 mm/jour, et la sortie k_sub du champ sortait rigoureusement uniforme. C'est pourtant le
# SEUL parametre dont la spatialisation soit mesuree comme payante : sur 95 stations et cinq
# territoires, chacun predit par un modele ajuste sur les autres, la texture du sol explique la
# part souterraine du debit a +27 % contre le temoin, quand la geologie du socle donne +3 % et
# le relief +11 %.
#
# MESURE, huit epoques en Outaouais contre un temoin identique : le champ passe d'un
# coefficient de variation spatial de 0,0000 a 0,2822, et le KGE median sur la periode
# d'evaluation vaut 0,7085 contre 0,7024, donc rien. Un champ plat de moins sur quarante-trois.
#
# L'ancrage de la MOYENNE du logarithme est obligatoire dans ce mode : sans lui rien ne tient
# la sortie. La variation spatiale, elle, reste LIBRE.
ETL_L3_KSUB = "champ"
ETL_KSUB_PRIOR = 0.3
ETL_L3_TAULAT = 3               # sortie latérale de la couche 3, en jours
ETL_NAPPE_LIBRE = 1
ETL_NAPPE_SY = 0.05
ETL_NAPPE_KB = 1.5e-3
ETL_NAPPE_ZRIV = 5.0
ETL_NAPPE_HREF = 2.0
ETL_NAPPE_ZEXT = 6.0
ETL_NAPPE_EFRAC = 0.15
# Exposant de vidange MESURÉ sur les récessions observées du territoire, et non appris.
# Aucune covariable de terrain ne le prédit, texture à -8 % contre le témoin, socle à -22 %,
# relief à -26 %. Mais il se lit dans les hydrogrammes, sans circularité : 1,36 en Montérégie
# drainée, 2,06 au Saint-Laurent sud-ouest, 2,30 au nord-ouest, 2,44 au Saguenay, 2,70 en
# Gaspésie, 4,65 en Outaouais. Un territoire de moins de cinq stations garde 2,0, la loi de
# Dupuit-Boussinesq, qui est aussi la médiane des 76 stations mesurées.
ETL_NAPPE_EXP = "mesure"

# -- Souterrain, inchangé ------------------------------------------------------
ETL_AQUIFER = 1
ETL_KREC_LIBRE = 1
ETL_KGW_FIELD = 1
MEANDRE_KGW_MODULE = 1

# -- Descripteurs de sol de l'IRDA ---------------------------------------------
# Six propriétés par tronçon, plus une part non cartographiée. Elles ne sont pas prédictibles
# par les attributs actuels, R² hors bloc de 0,09 à 0,37, et distinguent 40 % des voisins que
# ces attributs confondent. Un point de reprise sans ces colonnes les reçoit à poids nuls,
# donc un modèle inchangé au départ.
# RÉSERVE : la couverture s'arrête au sud agricole, 92 % des tronçons au Saint-Laurent
# sud-ouest, 50 % en Montérégie, 42 % en Outaouais, 19 à 21 % ailleurs et presque rien sur la
# Côte-Nord et en Abitibi. La part non cartographiée entre comme une variable à part entière,
# pour ne pas confondre sol inconnu et classe absente.
ETL_IRDA = 1

# -- Contraintes auxiliaires ---------------------------------------------------
# Elles ne transmettaient AUCUN gradient jusqu'au 20 septembre : les diagnostics dont elles
# dérivent étaient détachés du graphe sous MEANDRE_DIAG_CPU=1. Correctif livré, avec une garde
# qui signale tout terme actif dont le diagnostic serait détaché.
# Effet mesuré du correctif, à configuration identique : les contraintes coûtent 0,032 de KGE
# tenu de côté et DIVISENT PAR QUATRE la dispersion entre tirages, de 0,0141 à 0,0036.
# GRACE EN FORME PLUTOT QU'EN NIVEAU (2026-09-21). Le mode en niveau compare des
# millimetres a une incertitude de 25 mm par estimation mensuelle. Mesure sur huit epoques
# en Outaouais : le terme vaut 37 a 395 en valeur brute, soit six a vingt fois cette
# incertitude, contre 0,41 a 0,53 pour l'ensemble des termes de debit. C'est la situation
# que le code annonce lui-meme comme insatisfaisable. Le mode de rechange, ecrit le
# 2026-08-26, divise chaque cote par son propre ecart-type et ne retient que la phase et la
# forme ; il n'avait jamais ete branche par aucune configuration. Le terme de biais
# saisonnier s'eteint de lui-meme dans ce mode.
ETL_TWS_FORME = 1
ETL_WET = 0.4                   # évapotranspiration MODIS
ETL_WSWE = 0.2                  # masse du manteau mesurée au sol, CanSWE
# Les niveaux de puits restent HORS de la perte, et c'est un choix délibéré. La physique
# corrigée les satisfait déjà sans être contrainte, l'effet mesuré valant quatre millièmes de
# KGE. Les y mettre coûterait la seule vérification indépendante dont le projet dispose.
# NIVEAUX DE NAPPE MESURES : POIDS RENDU (2026-09-22). Ils etaient a zero pour garder les
# puits hors de toute perte, la corroboration de la physique de drainage profond valant
# precisement par la. ETL_NAPPE_VALID tient desormais la moitie des puits de cote, par un
# ordre stable et non par un tirage, ce qui rend le poids sans perdre la preuve : en
# Outaouais, six puits dans la perte et six tenus de cote.
#
# LE POIDS EST MESURE, NON HERITE. A poids 1, le terme vaut 0,182 en perte ponderee contre
# 2,31 pour l'ensemble des termes de debit, soit 7 %. La contrainte de neige a 6 % n'a rien
# deplace en huit epoques ; 2,0 porte le terme a environ 14 %.
#
# CE QUI JUSTIFIE DE LE RENDRE : sur l'Outaouais, l'apport PROPRE des puits au reste des
# observations vaut quatre directions independantes, contre zero pour la gravimetrie,
# l'evapotranspiration MODIS et la neige NEISIM. Treize puits portent plus d'information
# independante que des dizaines de millions de valeurs satellitaires.
ETL_WNAPPE = 2.0
ETL_NAPPE_VALID = 0.5

# -- Numérique et routage, inchangés ------------------------------------------
MEANDRE_NSUBSTEP = 64
MEANDRE_KMUSK = "4,48,24"
MEANDRE_DIAG_CPU = 1

# ─── Fonction de perte : LA DÉCISION QUI RESTE ────────────────────────────────
# Trois mesures, toutes sans simuler, disent que la recette en vigueur est mal posée pour la
# grandeur que le projet doit prédire.
#
# 1. Elle PRÉFÈRE un hydrogramme lissé sur sept jours à un hydrogramme net décalé d'un jour,
#    sur 64 % des stations. Le terme de pics y contribue pour -0,0951, dix-huit fois le
#    deuxième, parce qu'un écart quadratique restreint aux hauts débits est minimal là où un
#    décalage coûte le plus cher. Le KGE entier est le seul terme qui l'en empêche.
# 2. Ses cinq termes de débit n'engendrent que trois directions indépendantes, et son plus
#    grand angle mort, 48 %, est le soutien d'étiage, dont le poids vaut zéro.
# 3. Une erreur de calendrier d'un jour y pèse 23 fois un prélèvement estival de 5 % du débit
#    moyen annuel. Avec les poids équilibrés ci-dessous, ce rapport tombe à 0,83.
#
# Et le gradient, pris sur la sortie réelle du modèle, dit la même chose : la recette en
# vigueur demande de monter les crues et ne touche pas les étiages, contraste -2,59 ; la
# recette équilibrée monte les étiages et baisse les crues, contraste +0,32. Elle est la seule
# des trois essayées à pousser vers l'écoulement de base.
#
# CE QUI MANQUE POUR TRANCHER. Le seul essai d'entraînement comparant ces recettes a tourné
# sur la physique de RÉFÉRENCE, dont la couche 3 est engorgée et qui envoie 86 % de l'eau en
# surface. Le terme d'étiage y réclame une eau souterraine que la colonne ne peut pas produire,
# et les deux recettes décomposées y ont coûté 0,049 de KGE. Cet essai ne dit donc rien de leur
# comportement sur la physique corrigée. Une passe de huit époques sur l'Outaouais, trente
# minutes, le dirait.

# Recette en vigueur, celle des modèles du 15 septembre. Conservatrice.
ETL_WKGE = 1.0
ETL_WPBIAS = 0.5
ETL_WMSE = 0.1
ETL_WLOGMSE = 0.3
ETL_WPEAK = 0.5

